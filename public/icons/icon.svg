<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#07090e" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  <!-- Compass Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#brandGrad)" stroke-width="20" stroke-dasharray="8 12" filter="url(#glow)" />
  <!-- Plane Path Arc -->
  <path d="M 160 350 Q 256 120 360 210" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="10 10" />
  <!-- Central Compass Needle / Airplane -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <!-- North Arrow -->
    <polygon points="256,120 285,256 256,230 227,256" fill="url(#brandGrad)" />
    <!-- South Arrow -->
    <polygon points="256,392 285,256 256,282 227,256" fill="#f43f5e" />
    <!-- Center Dot -->
    <circle cx="256" cy="256" r="22" fill="#fff" filter="url(#glow)" />
    <circle cx="256" cy="256" r="10" fill="#07090e" />
  </g>
</svg>
