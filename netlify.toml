[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

# Redirect API calls to Netlify Python serverless function
[[redirects]]
  from = "/api/plan"
  to = "/.netlify/functions/plan"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Netlify function settings
[functions]
  included_files = ["data/**", "src/**"]
